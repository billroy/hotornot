&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;jev-jeff-triage-hover&quot;);
  const wrap = root.querySelector(&quot;.chart-wrap&quot;);
  const svg = d3.select(root.querySelector(&quot;svg&quot;));
  const tooltip = root.querySelector(&quot;.tooltip&quot;);
  const data = JSON.parse(root.querySelector(&quot;.chart-data&quot;).textContent);
  const orderedData = [...data].sort((a, b) =&gt; Number(a.p) - Number(b.p));

  function draw() {
    const width = Math.max(320, Math.round(wrap.getBoundingClientRect().width));
    const margin = { top: 18, right: 18, bottom: 58, left: 64 };
    const plotSide = width - margin.left - margin.right;
    const height = margin.top + plotSide + margin.bottom;
    const innerWidth = plotSide;
    const innerHeight = plotSide;
    const extent = d3.extent([0, 100, ...data.flatMap(d =&gt; [d.x, d.y])]);
    const padding = (extent[1] - extent[0]) * 0.02;
    const domain = [extent[0] - padding, extent[1] + padding];
    const x = d3.scaleLinear().domain(domain).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain(domain).range([height - margin.bottom, margin.top]);
    const ticks = width &lt; 480 ? 4 : 6;

    svg.attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`).attr(&quot;height&quot;, null);
    svg.selectAll(&quot;*&quot;).remove();

    svg.append(&quot;rect&quot;)
      .attr(&quot;data-chart-frame&quot;, &quot;&quot;)
      .attr(&quot;x&quot;, margin.left)
      .attr(&quot;y&quot;, margin.top)
      .attr(&quot;width&quot;, innerWidth)
      .attr(&quot;height&quot;, innerHeight)
      .attr(&quot;fill&quot;, &quot;transparent&quot;)
      .attr(&quot;stroke-width&quot;, 1);

    svg.append(&quot;g&quot;)
      .attr(&quot;class&quot;, &quot;grid&quot;)
      .attr(&quot;transform&quot;, `translate(0,${height - margin.bottom})`)
